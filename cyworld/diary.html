    <script src="https://kit.fontawesome.com/ab54b9d48d.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="bookcover">
      <div class="bookdot">
        <div class="page">
          <!-- 프로필 영역 -->
          <div class="profile-container">
            <div class="header profile-title font-neo">
              TODAY<span class="color-red"> 28</span> | TOTAL 234918
            </div>
            <div class="box profile-box">
              <div class="profile-image">
                <img class="profile-image-img" src="./static/images/cyworld1.png" alt="프로필 이미지" />
              </div>
              <div class="profile-text font-kyobohand">
                ㄴr는.. 오늘도.. 눈물을.. 흘린ㄷr..★
              </div>
              <div class="profile-status font-neo">
                <div class="status-item">
                  <span class="status-label">TODAY IS...</span>
                  <span class="status-val color-blue">💧 슬픔 (80%)</span>
                </div>
                <div class="status-item">
                  <span class="status-label">BGM 🎵</span>
                  <marquee class="bgm-text" behavior="scroll" direction="left" scrollamount="3">
                    프리스타일 - Y (Please Tell Me Why)
                  </marquee>
                </div>
              </div>
              <div class="profile-username font-kyobohand">
                <span style="color: #0f1b5c">ㄷr르양</span> (♪♬)
              </div>
              <div class="profile-dropdown">
                <div class="dropdown-button">
                  <div class="dropdown-title">파도타기</div>
                  <div class="triangle-down"></div>
                </div>
                <div class="dropdown-content">
                  <a href="https://blog.naver.com" target="_blank">블로그 바로가기</a>
                  <a href="https://facebook.com" target="_blank">페이스북 바로가기</a>
                  <a href="https://instagram.com" target="_blank">인스타그램 바로가기</a>
                </div>
              </div>
            </div>
          </div>

          <!-- 메인 콘텐츠 영역 -->
          <div class="content-container">
            <div class="header content-title">
              <div class="content-title-name font-neo">ㄷr르양의 추억 상ㅈr... (*ˊᵕˋo💐o</div>
              <div class="content-title-url">https://cyworld.com/darea</div>
            </div>
            <div class="box content-box">
              <div class="calendar-nav font-neo">
                <button type="button" class="calendar-nav-button" id="calendar-prev" aria-label="이전 달">&#8249;</button>
                <span class="calendar-month" id="calendar-month"></span>
                <button type="button" class="calendar-nav-button" id="calendar-next" aria-label="다음 달">&#8250;</button>
              </div>
              <div class="calendar">
                <div class="date-today" id="date-today"></div>
                <div class="date-list" id="date-list"></div>
              </div>
              <div class="diary-scrollbox">
                <div id="diary-list" aria-live="polite"></div>
                <div class="button-box">
                  <button class="diary-button font-neo" onclick="getTextFile()">
                    <i class="fas fa-lock"></i>ㄷr르양의 비밀 일기 보기
                  </button>
                </div>
                <div class="diary" id="secret-box">
                  <div class="diary-date">🔒 ㄷr르양의 비밀 일기 내용</div>
                  <div class="diary-contents font-kyobohand" id="secret-diary"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 메뉴 탭 -->
          <div class="menu-container">
            <div class="menu-button">
              <a href="home.html"><button>홈</button></a>
              <a href="diary.html"><button class="active">다이어리</button></a>
              <a href="picture.html"><button>사진첩</button></a>
              <a href="guestbook.html"><button>방명록</button></a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./static/diary-data.js"></script>
    <script src="./static/diary.js"></script>
    <script>
      function getTextFile() {
        var input = document.createElement("input");
        input.type = "file";
        input.accept = "text/plain";
        input.onchange = function (event) {
          processFile(event.target.files[0]);
        };
        input.click();
      }

      function processFile(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.readAsText(file, "utf-8");
        reader.onload = function () {
          document.getElementById("secret-diary").innerText = reader.result;
          document.getElementById("secret-box").style.display = "block";
        };
      }
    </script>
  </body>
</html>
